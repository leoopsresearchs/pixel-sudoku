<!doctype html>
<html lang="pt-BR" class="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixel Sudoku</title>
  <meta name="description" content="Sudoku pixel art com dificuldade progressiva, para jogar offline.">
  <meta name="theme-color" content="#1a1c2c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <main id="app">
    <!-- Início -->
    <section id="screen-home" class="screen home">
      <div class="home-top">
        <span class="home-kicker">PIXEL</span>
        <canvas id="title" class="pixelated" aria-label="Sudoku"></canvas>
      </div>
      <canvas id="mascot" class="pixelated mascot" width="16" height="13" aria-hidden="true"></canvas>
      <nav class="home-menu">
        <button class="btn btn-primary btn-big" id="btn-play">
          <span class="btn-label">JOGAR</span>
          <small id="play-sub">NÍVEL 1</small>
        </button>
        <button class="btn btn-big" id="btn-free"><span class="btn-label">JOGO LIVRE</span><small>PUZZLES SEM FIM</small></button>
        <button class="btn btn-big" id="btn-levels"><span class="btn-label">NÍVEIS</span></button>
        <button class="btn btn-big" id="btn-settings"><span class="btn-label">AJUSTES</span></button>
      </nav>
    </section>

    <!-- Mapa de níveis -->
    <section id="screen-map" class="screen" hidden>
      <header class="topbar">
        <button class="btn btn-icon" id="map-back" aria-label="Voltar"></button>
        <h2 class="topbar-title">NÍVEIS</h2>
      </header>
      <div class="map-scroll" id="worlds"></div>
    </section>

    <!-- Partida -->
    <!-- HUD nos cantos e tabuleiro no centro; o teclado de números fica fora do tabuleiro
         (embaixo em pé, perto do polegar direito deitado) para nunca cobrir as casas. -->
    <section id="screen-game" class="screen game" hidden>
      <button class="btn btn-icon hud-pause" id="btn-pause" aria-label="Pausar"></button>
      <div class="level-info hud-info">
        <span id="game-world"></span>
        <strong id="game-level"></strong>
        <div class="progress" id="game-progress" role="progressbar" aria-label="Casas preenchidas"><i></i></div>
      </div>
      <span class="px-chip hud-timer" id="game-timer"></span>
      <div class="board-wrap" id="board-wrap">
        <div class="board" id="board"></div>
      </div>
      <div class="keypad" id="keypad" role="group" aria-label="Números"></div>
      <button class="btn btn-icon hud-undo" id="btn-undo" aria-label="Desfazer"></button>
    </section>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="panel px-panel" id="panel" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <canvas id="fx" class="pixelated" aria-hidden="true"></canvas>

  <script type="module" src="js/main.js"></script>
</body>
</html>
